<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>회의실 예약 목록</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Noto+Sans+KR:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
        <link rel="stylesheet" th:href="@{${proxyPath} + '/css/style.css'}" />
        <link rel="stylesheet" th:href="@{${proxyPath} + '/css/meeting-room-list.css'}" />
    </head>
    <body>
        <header class="header">
            <div class="header-content">
                <div class="header-title">회의실 예약 시스템</div>
                <div class="nav">
                    <a th:href="@{${frontProxyPath} + '/page/meetings/reserve'}">예약하기</a>
                    <a th:href="@{${frontProxyPath} + '/page/meetings'}" class="active">예약 목록</a>
                </div>
            </div>
        </header>

        <main class="main">
            <!-- Flash Messages -->
            <div
                th:if="${message}"
                class="alert-message success-message"
                style="display: none"
                th:data-message="${message}"
                th:data-type="success"
            ></div>
            <div
                th:if="${error}"
                class="alert-message error-message"
                style="display: none"
                th:data-message="${error}"
                th:data-type="error"
            ></div>

            <div class="glass-card">
                <h1 class="card-title">회의실 예약 목록</h1>

                <div class="tabs">
                    <div class="tab active" onclick="switchTab('my-reservations')">내 예약 현황</div>
                    <div class="tab" onclick="switchTab('all-reservations')">전체 예약 현황</div>
                </div>

                <!-- 내 예약 현황 탭 -->
                <div id="my-reservations" class="tab-content active">
                    <input class="search-bar" type="text" placeholder="회의명 검색" />
                    <div class="filter-btns">
                        <button class="active">모든 회의실</button>
                        <button>모든 날짜</button>
                        <button>모든 상태</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>회의명</th>
                                <th>날짜</th>
                                <th>시간</th>
                                <th>회의실</th>
                                <th>상태</th>
                                <th>작업</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="reservation : ${myReservations}" th:if="${not #lists.isEmpty(myReservations)}">
                                <td th:text="${reservation.title}">투자팀 주간 회의</td>
                                <td th:text="${#temporals.format(reservation.date, 'yyyy년 M월 d일')}">
                                    2025년 5월 1일
                                </td>
                                <td>
                                    <span th:text="${#temporals.format(reservation.startTime, 'HH:mm')}"></span>
                                    -
                                    <span th:text="${#temporals.format(reservation.endTime, 'HH:mm')}"></span>
                                </td>
                                <td th:text="${reservation.roomName}">회의실 A</td>
                                <td>
                                    <span class="badge confirmed">확정</span>
                                </td>
                                <td>
                                    <button
                                        class="action-btn view"
                                        th:onclick="|location.href='@{${frontProxyPath} + '/page/meetings/${reservation.meetingId}'}'|"
                                    >
                                        보기
                                    </button>
                                    <button
                                        class="action-btn edit"
                                        th:onclick="|location.href='@{${frontProxyPath} + '/page/meetings/reserve/${reservation.meetingId}'}'|"
                                    >
                                        수정
                                    </button>
                                    <button
                                        type="button"
                                        class="action-btn delete"
                                        th:with="now=${#temporals.createNow()},
                                                reservationDate=${reservation.date},
                                                reservationStart=${reservation.startTime},
                                                isPast=${reservationDate.isBefore(now.toLocalDate()) || (reservationDate.isEqual(now.toLocalDate()) && reservationStart.isBefore(now.toLocalTime()))}"
                                        th:disabled="${isPast}"
                                        th:title="${isPast ? '지난 예약은 취소할 수 없습니다' : ''}"
                                        th:onclick="${isPast} ? '' : |event.preventDefault(); openCancelReservationModal(${reservation.meetingId}); return false;|"
                                    >
                                        취소
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(myReservations)}">
                                <td colspan="6" class="no-reservations">예약 내역이 없습니다.</td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="pagination" th:if="${myTotalPages > 0}">
                        <span th:each="pageNumber : ${#numbers.sequence(1, myTotalPages)}">
                            <a
                                th:href="@{${frontProxyPath} + '/page/meetings(tab=my, page=${pageNumber - 1})'}"
                                th:text="${pageNumber}"
                                th:class="${pageNumber == myPage} ? 'active' : ''"
                            >
                            </a>
                        </span>
                    </div>
                    <div class="empty-message" th:if="${#lists.isEmpty(myReservations)}">
                        <p>예약 내역이 없습니다.</p>
                    </div>
                </div>

                <!-- 전체 예약 현황 탭 -->
                <div id="all-reservations" class="tab-content">
                    <input class="search-bar" type="text" placeholder="회의명 또는 담당자명 검색" />
                    <div class="filter-btns">
                        <button class="active">모든 회의실</button>
                        <button>모든 날짜</button>
                        <button>모든 상태</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>회의명</th>
                                <th>날짜</th>
                                <th>시간</th>
                                <th>회의실</th>
                                <th>담당자</th>
                                <th>상태</th>
                                <th>작업</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr
                                th:each="reservation : ${allReservations}"
                                th:if="${not #lists.isEmpty(allReservations)}"
                            >
                                <td th:text="${reservation.title}">투자팀 주간 회의</td>
                                <td th:text="${#temporals.format(reservation.date, 'yyyy년 M월 d일')}">
                                    2025년 5월 1일
                                </td>
                                <td>
                                    <span th:text="${#temporals.format(reservation.startTime, 'HH:mm')}"></span>
                                    -
                                    <span th:text="${#temporals.format(reservation.endTime, 'HH:mm')}"></span>
                                </td>
                                <td th:text="${reservation.roomName}">회의실 A</td>
                                <td th:text="${reservation.userName}">홍길동</td>
                                <td>
                                    <span class="badge confirmed">확정</span>
                                </td>
                                <td>
                                    <button
                                        class="action-btn view"
                                        th:onclick="|location.href='@{${frontProxyPath} + '/page/meetings/${reservation.meetingId}'}'|"
                                    >
                                        보기
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(allReservations)}">
                                <td colspan="7" class="no-reservations">예약 내역이 없습니다.</td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="pagination" th:if="${allTotalPages > 0}">
                        <span th:each="pageNumber : ${#numbers.sequence(1, allTotalPages)}">
                            <a
                                th:href="@{${frontProxyPath} + '/page/meetings(tab=all, page=${pageNumber - 1})'}"
                                th:text="${pageNumber}"
                                th:class="${pageNumber == allPage} ? 'active' : ''"
                            >
                            </a>
                        </span>
                    </div>
                    <div class="empty-message" th:if="${#lists.isEmpty(allReservations)}">
                        <p>예약 내역이 없습니다.</p>
                    </div>
                </div>
            </div>

            <!-- 취소 확인 모달 -->
            <div id="confirmModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>예약 취소 확인</h2>
                        <span class="close">&times;</span>
                    </div>
                    <div class="modal-body">
                        <p>정말로 이 예약을 취소하시겠습니까?</p>
                        <p>이 작업은 되돌릴 수 없습니다.</p>
                    </div>
                    <div class="modal-footer">
                        <form id="cancelForm" method="post">
                            <input type="hidden" name="_method" value="DELETE" />
                            <button id="confirmCancel" type="submit" class="action-btn cancel">예약 취소</button>
                        </form>
                        <button id="cancelCancel" type="button" class="action-btn view">돌아가기</button>
                    </div>
                </div>
            </div>

            <!-- 알림 모달 -->
            <div id="alertModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="alertTitle">알림</h2>
                        <span class="close-alert">&times;</span>
                    </div>
                    <div class="modal-body">
                        <p id="alertMessage"></p>
                    </div>
                    <div class="modal-footer">
                        <button id="alertConfirm" type="button" class="action-btn edit">확인</button>
                    </div>
                </div>
            </div>
        </main>

        <script th:inline="javascript">
            // 현재 페이지 정보
            let currentTab = "my-reservations";
            let myPage = 1;
            let allPage = 1;

            // proxyPath 가져오기
            const proxyPath = /*[[${frontProxyPath}]]*/ "";

            // 날짜 포맷 함수
            function formatDate(dateStr) {
                if (!dateStr) return "";
                try {
                    const date = new Date(dateStr);
                    const year = date.getFullYear();
                    const month = date.getMonth() + 1;
                    const day = date.getDate();
                    return `${year}년 ${month}월 ${day}일`;
                } catch (e) {
                    console.error("날짜 변환 오류:", e);
                    return "";
                }
            }

            // 시간 포맷 함수
            function formatTime(timeStr) {
                if (!timeStr) return "";
                try {
                    return timeStr.substring(0, 5); // HH:mm 형식으로 변환
                } catch (e) {
                    console.error("시간 변환 오류:", e);
                    return "";
                }
            }

            // 내 예약 목록 로드
            function loadMyMeetingData(page = 0) {
                showLoading();
                fetch(`${proxyPath}/api/meetings/my?page=${page}`)
                    .then((response) => response.json())
                    .then((data) => {
                        // DOM 요소를 안전하게 선택
                        const myReservations = document.getElementById("my-reservations");
                        if (!myReservations) {
                            console.error("내 예약 현황 탭 요소를 찾을 수 없습니다.");
                            return;
                        }

                        const tbody = myReservations.querySelector("tbody");
                        const paginationDiv = myReservations.querySelector(".pagination");
                        const emptyMessageDiv = myReservations.querySelector(".empty-message");

                        if (!tbody) {
                            console.error("내 예약 현황 테이블 본문을 찾을 수 없습니다.");
                            return;
                        }

                        // tbody 내용 지우기
                        tbody.innerHTML = "";

                        if (data.content && data.content.length > 0) {
                            // 데이터가 있는 경우 테이블 채우기
                            data.content.forEach((reservation) => {
                                // 현재 시간 체크
                                const now = new Date();
                                const reservationDate = new Date(reservation.date);

                                // 예약 날짜에 시간 추가
                                if (reservation.startTime) {
                                    const [hours, minutes] = reservation.startTime.split(":");
                                    reservationDate.setHours(parseInt(hours, 10));
                                    reservationDate.setMinutes(parseInt(minutes, 10));
                                }

                                // 현재 시간보다 과거인지 확인
                                const isPast = reservationDate <= now;

                                tbody.innerHTML += `
                                    <tr>
                                        <td>${reservation.title || ""}</td>
                                        <td>${formatDate(reservation.date) || ""}</td>
                                        <td>${formatTime(reservation.startTime) || ""} - ${
                                    formatTime(reservation.endTime) || ""
                                }</td>
                                        <td>${reservation.roomName || ""}</td>
                                        <td><span class="badge confirmed">확정</span></td>
                                        <td>
                                            <button class="action-btn view" onclick="location.href='${proxyPath}/page/meetings/${
                                    reservation.meetingId
                                }'">보기</button>
                                            <button class="action-btn edit" onclick="location.href='${proxyPath}/page/meetings/reserve/${
                                    reservation.meetingId
                                }'" ${isPast ? 'disabled title="지난 예약은 수정할 수 없습니다"' : ""}>수정</button>
                                            <button type="button" class="action-btn delete" 
                                            ${isPast ? 'disabled title="지난 예약은 취소할 수 없습니다"' : ""}
                                            onclick="${
                                                isPast
                                                    ? ""
                                                    : `event.preventDefault(); openCancelReservationModal(${reservation.meetingId}); return false;`
                                            }">취소</button>
                                        </td>
                                    </tr>
                                `;
                            });

                            // 페이지네이션 업데이트
                            if (paginationDiv && data.totalPages > 0) {
                                let paginationHtml = "";
                                for (let i = 1; i <= data.totalPages; i++) {
                                    const activeClass = i === data.currentPage ? "active" : "";
                                    paginationHtml += `<span><a href="javascript:void(0)" onclick="loadMyMeetingData(${
                                        i - 1
                                    })" class="${activeClass}">${i}</a></span>`;
                                }
                                paginationDiv.innerHTML = paginationHtml;
                                paginationDiv.style.display = "flex";

                                // 현재 페이지 업데이트 (서버는 0부터 시작하므로 1을 더해 1부터 시작하는 값으로 변환)
                                myPage = data.currentPage + 1;
                            } else if (paginationDiv) {
                                paginationDiv.style.display = "none";
                            }

                            // 빈 메시지 숨기기
                            if (emptyMessageDiv) {
                                emptyMessageDiv.style.display = "none";
                            }
                        } else {
                            // 데이터가 없는 경우
                            tbody.innerHTML = `<tr><td colspan="6" class="no-reservations">예약 내역이 없습니다.</td></tr>`;
                            if (paginationDiv) {
                                paginationDiv.style.display = "none";
                            }
                            if (emptyMessageDiv) {
                                emptyMessageDiv.style.display = "block";
                            }
                        }
                    })
                    .catch((error) => {
                        console.error(error);
                        showAlert(error.message, "오류", false);
                    })
                    .finally(() => {
                        hideLoading();
                    });
            }

            // 전체 예약 목록 로드
            function loadAllMeetingData(page = 0) {
                showLoading();
                fetch(`${proxyPath}/api/meetings?page=${page}`)
                    .then((response) => response.json())
                    .then((data) => {
                        // DOM 요소를 안전하게 선택
                        const allReservations = document.getElementById("all-reservations");
                        if (!allReservations) {
                            console.error("전체 예약 현황 탭 요소를 찾을 수 없습니다.");
                            return;
                        }

                        const tbody = allReservations.querySelector("tbody");
                        const paginationDiv = allReservations.querySelector(".pagination");
                        const emptyMessageDiv = allReservations.querySelector(".empty-message");

                        if (!tbody) {
                            console.error("전체 예약 현황 테이블 본문을 찾을 수 없습니다.");
                            return;
                        }

                        // tbody 내용 지우기
                        tbody.innerHTML = "";

                        if (data.content && data.content.length > 0) {
                            // 데이터가 있는 경우 테이블 채우기
                            data.content.forEach((reservation) => {
                                tbody.innerHTML += `
                                    <tr>
                                        <td>${reservation.title || ""}</td>
                                        <td>${formatDate(reservation.date) || ""}</td>
                                        <td>${formatTime(reservation.startTime) || ""} - ${
                                    formatTime(reservation.endTime) || ""
                                }</td>
                                        <td>${reservation.roomName || ""}</td>
                                        <td>${reservation.userName || ""}</td>
                                        <td><span class="badge confirmed">확정</span></td>
                                        <td>
                                            <button class="action-btn view" onclick="location.href='${proxyPath}/page/meetings/${
                                    reservation.meetingId
                                }'">보기</button>
                                        </td>
                                    </tr>
                                `;
                            });

                            // 페이지네이션 업데이트
                            if (paginationDiv && data.totalPages > 0) {
                                let paginationHtml = "";
                                for (let i = 1; i <= data.totalPages; i++) {
                                    const activeClass = i === data.currentPage ? "active" : "";
                                    paginationHtml += `<span><a href="javascript:void(0)" onclick="loadAllMeetingData(${
                                        i - 1
                                    })" class="${activeClass}">${i}</a></span>`;
                                }
                                paginationDiv.innerHTML = paginationHtml;
                                paginationDiv.style.display = "flex";

                                // 현재 페이지 업데이트
                                allPage = data.currentPage + 1;
                            } else if (paginationDiv) {
                                paginationDiv.style.display = "none";
                            }

                            // 빈 메시지 숨기기
                            if (emptyMessageDiv) {
                                emptyMessageDiv.style.display = "none";
                            }
                        } else {
                            // 데이터가 없는 경우
                            tbody.innerHTML = `<tr><td colspan="7" class="no-reservations">예약 내역이 없습니다.</td></tr>`;
                            if (paginationDiv) {
                                paginationDiv.style.display = "none";
                            }
                            if (emptyMessageDiv) {
                                emptyMessageDiv.style.display = "block";
                            }
                        }
                    })
                    .catch((error) => {
                        console.error(error);
                        showAlert(error.message, "오류", false);
                    })
                    .finally(() => {
                        hideLoading();
                    });
            }

            function switchTab(tabId) {
                // DOM 요소 확인
                if (!document.getElementById(tabId)) {
                    console.error(`탭 요소를 찾을 수 없습니다: ${tabId}`);
                    return;
                }

                // 모든 탭 컨텐츠 숨기기
                document.querySelectorAll(".tab-content").forEach((content) => {
                    content.classList.remove("active");
                });

                // 모든 탭 비활성화
                document.querySelectorAll(".tab").forEach((tab) => {
                    tab.classList.remove("active");
                });

                // 선택한 탭 내용 보이기
                document.getElementById(tabId).classList.add("active");

                // 선택한 탭 활성화
                const tabElements = document.querySelectorAll(".tab");
                const tabIndex = tabId === "my-reservations" ? 0 : 1;
                if (tabElements.length > tabIndex) {
                    tabElements[tabIndex].classList.add("active");
                }

                // 현재 탭 저장
                currentTab = tabId;

                // 데이터 로드 전에 오류 처리
                try {
                    if (tabId === "my-reservations") {
                        // 페이지 번호가 음수가 되지 않도록 보정
                        const pageIndex = Math.max(0, myPage - 1);
                        loadMyMeetingData(pageIndex);
                    } else {
                        // 페이지 번호가 음수가 되지 않도록 보정
                        const pageIndex = Math.max(0, allPage - 1);
                        loadAllMeetingData(pageIndex);
                    }
                } catch (error) {
                    console.error("탭 데이터 로드 중 오류 발생:", error);
                    showAlert("데이터를 로드하는 중 문제가 발생했습니다.", "오류", false);
                }
            }

            // URL에서 탭 파라미터 읽기
            document.addEventListener("DOMContentLoaded", function () {
                // 모달 요소 초기화
                initializeModal();

                // Flash 메시지 처리
                const successMessage = document.querySelector(".alert-message.success-message");
                const errorMessage = document.querySelector(".alert-message.error-message");

                if (successMessage && successMessage.hasAttribute("th:data-message")) {
                    const message = successMessage.getAttribute("data-message");
                    if (message) {
                        showAlert(message, "알림", true);
                    }
                }

                if (errorMessage && errorMessage.hasAttribute("th:data-message")) {
                    const message = errorMessage.getAttribute("data-message");
                    if (message) {
                        showAlert(message, "오류", false);
                    }
                }

                // 탭 초기화
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const tabParam = urlParams.get("tab");

                    if (tabParam === "all") {
                        switchTab("all-reservations");
                    } else {
                        switchTab("my-reservations");
                    }
                } catch (error) {
                    console.error("탭 초기화 중 오류 발생:", error);
                    // 기본 탭을 로드
                    if (document.getElementById("my-reservations")) {
                        switchTab("my-reservations");
                    }
                }
            });

            // 로딩 표시 함수
            function showLoading() {
                try {
                    // 기존에 로딩 요소가 있다면 제거
                    const existingLoading = document.getElementById("loadingSpinner");
                    if (existingLoading) {
                        existingLoading.style.display = "flex";
                        return;
                    }

                    // 새 로딩 요소 생성
                    const loadingDiv = document.createElement("div");
                    loadingDiv.id = "loadingSpinner";
                    loadingDiv.style.position = "fixed";
                    loadingDiv.style.top = "0";
                    loadingDiv.style.left = "0";
                    loadingDiv.style.width = "100%";
                    loadingDiv.style.height = "100%";
                    loadingDiv.style.backgroundColor = "rgba(255, 255, 255, 0.7)";
                    loadingDiv.style.display = "flex";
                    loadingDiv.style.justifyContent = "center";
                    loadingDiv.style.alignItems = "center";
                    loadingDiv.style.zIndex = "9999";

                    // 로딩 스피너 스타일
                    const spinner = document.createElement("div");
                    spinner.style.border = "5px solid rgba(45, 108, 223, 0.1)";
                    spinner.style.borderRadius = "50%";
                    spinner.style.borderTop = "5px solid #2d6cdf";
                    spinner.style.width = "50px";
                    spinner.style.height = "50px";
                    spinner.style.animation = "spin 1s linear infinite";

                    // 스피너 애니메이션 추가
                    const style = document.createElement("style");
                    style.innerHTML = `
                        @keyframes spin {
                            0% { transform: rotate(0deg); }
                            100% { transform: rotate(360deg); }
                        }
                    `;
                    document.head.appendChild(style);

                    // 로딩 요소 추가
                    loadingDiv.appendChild(spinner);
                    document.body.appendChild(loadingDiv);
                } catch (error) {
                    console.error("로딩 표시 중 오류 발생:", error);
                }
            }

            // 로딩 숨기기 함수
            function hideLoading() {
                try {
                    const loading = document.getElementById("loadingSpinner");
                    if (loading) {
                        loading.style.display = "none";
                    }
                } catch (error) {
                    console.error("로딩 숨기기 중 오류 발생:", error);
                }
            }

            // 모달 요소 초기화 함수
            function initializeModal() {
                // 모달 요소들
                const modal = document.getElementById("confirmModal");
                const alertModal = document.getElementById("alertModal");
                const closeBtn = document.getElementsByClassName("close")[0];
                const closeAlertBtn = document.getElementsByClassName("close-alert")[0];
                const confirmBtn = document.getElementById("confirmCancel");
                const cancelBtn = document.getElementById("cancelCancel");
                const alertTitle = document.getElementById("alertTitle");
                const alertMessage = document.getElementById("alertMessage");
                const alertConfirm = document.getElementById("alertConfirm");
                const cancelForm = document.getElementById("cancelForm");

                // 전역 변수 설정
                window.meetingIdToCancel = null;

                // 모달 닫기 함수
                function closeConfirmModal() {
                    modal.style.display = "none";
                }

                function closeAlertModal() {
                    alertModal.style.display = "none";

                    // 성공한 경우에만 데이터 다시 로드
                    if (alertConfirm.className.includes("edit")) {
                        const pageIndex =
                            currentTab === "my-reservations" ? Math.max(0, myPage - 1) : Math.max(0, allPage - 1);

                        currentTab === "my-reservations" ? loadMyMeetingData(pageIndex) : loadAllMeetingData(pageIndex);
                    }
                }

                // 이벤트 리스너 등록
                closeBtn.onclick = closeConfirmModal;
                cancelBtn.onclick = closeConfirmModal;
                closeAlertBtn.onclick = closeAlertModal;
                alertConfirm.onclick = closeAlertModal;

                // 폼 제출 시 모달 닫기
                cancelForm.addEventListener("submit", function () {
                    closeConfirmModal();
                });

                // 모달 외부 클릭시 닫기
                window.onclick = function (event) {
                    if (event.target == modal) {
                        closeConfirmModal();
                    } else if (event.target == alertModal) {
                        closeAlertModal();
                    }
                };
            }

            // 모달 닫기 함수
            function closeModal(modalId) {
                const modal = document.getElementById(modalId);
                if (modal) {
                    modal.style.display = "none";
                }
            }

            // 취소 버튼 클릭 시 모달 표시
            function openCancelReservationModal(meetingId) {
                window.meetingIdToCancel = meetingId;
                const modal = document.getElementById("confirmModal");
                modal.style.display = "block";

                // 폼 action 설정
                const cancelForm = document.getElementById("cancelForm");
                cancelForm.action = `${proxyPath}/api/meetings/${meetingId}`;

                // 이벤트 기본 동작 방지를 위한 추가 조치
                if (event) {
                    event.preventDefault();
                }
                return false;
            }

            // 사용자 정의 알림 함수
            function showAlert(message, title = "알림", isSuccess = true) {
                const alertTitle = document.getElementById("alertTitle");
                const alertMessage = document.getElementById("alertMessage");
                const alertConfirm = document.getElementById("alertConfirm");
                const alertModal = document.getElementById("alertModal");

                if (!alertModal || !alertTitle || !alertMessage || !alertConfirm) {
                    alert(message);
                    return;
                }

                // 제목과 메시지 설정
                alertTitle.textContent = title;
                alertMessage.textContent = message;

                // 성공/실패에 따라 스타일 변경
                alertTitle.style.color = isSuccess ? "#2d6cdf" : "#ff5a5a";
                alertConfirm.className = isSuccess ? "action-btn edit" : "action-btn cancel";

                // 모달 표시
                alertModal.style.display = "block";
            }

            // 성공 알림 함수
            function showSuccessAlert(message) {
                showAlert(message, "성공", true);
            }

            // 오류 알림 함수
            function showErrorAlert(message) {
                showAlert(message, "오류", false);
            }

            // JavaScript에서 경로 생성 시 proxyPath 사용
            function buildPath(path) {
                return `${proxyPath}${path}`;
            }
        </script>
    </body>
</html>
