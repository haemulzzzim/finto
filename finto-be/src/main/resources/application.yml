server:
    # 효진 노트북 local 용
    port: 8090
    forward-headers-strategy: native
    # develop 브랜치 용
    #  port: 8080

    servlet:
        context-path: /
        encoding:
            charset: UTF-8
            enabled: true
            force: true

spring:
    application:
        name: finto-be

    profiles:
        active: secret

    datasource:
        # FISA 노트북 용
        username: root
        #    password:
        driver-class-name: com.mysql.cj.jdbc.Driver

        hikari:
            pool-name: jpa-hikari-pool
            maximum-pool-size: 5
            jdbc-url: ${spring.datasource.url}
            username: ${spring.datasource.username}
            password: ${spring.datasource.password}
            driver-class-name: ${spring.datasource.driver-class-name}
            data-source-properties:
                rewriteBatchedStatements: true

    data:
        redis:
            host: localhost
            port: 6379
            # password:

    output.ansi.enabled: always
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: update # create, update, none
            # naming:
            #        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl # 대문자, 소분자 구분
        show-sql: true
        generate-ddl: true
        properties:
            hibernate:
                #        dialect:
                #        default_schema:
                format_sql: true

        defer-datasource-initialization: true

    jackson:
        serialization:
            write-dates-as-timestamps: false
        time-zone: Asia/Seoul

    mvc:
        hiddenmethod:
            filter:
                enabled: true
        log-request-details: true # request의 parameter 값 등을 log에서 못 보는 설정 해제

    thymeleaf:
        encoding: UTF-8

# 애플리케이션 커스텀 설정
app:
    proxy:
        # Nginx reverse proxy 경로 접두사
        path: ""
        front-path: /service
        # local 접두사
#    path: ""

logging.level:
    #  org.apache: trace
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    org:
        springframework:
            boot:
                security: trace
            #      security.oauth2:
            #        client: trace
            #        core: trace
            #
            #      boot:
            #        autoconfigure:
            #          security: trace
            web: trace

            http: trace
